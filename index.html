<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>

<body>

    <form action="/cadastrar" method="post">

        <label for="nome-completo">Nome Completo</label>
        <input type="text" id="nome-completo" name="nome" placeholder="Digite seu nome">
        <br>
        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="Digite seu email">
        <br>
        <label for="senha">Senha</label>
        <input type="password" name="senha" id="senha" placeholder="digite sua senha">
        <br>
        <label for="select">Selecione a área desejada</label>
        <select name="select" id="select">
            <option value="front-end">Front-end</option>
            <option value="back-end">Back-end</option>
            <option value="full-stack">Full-Stack</option>
        </select>
        <br>
        <label for="termos">Li e concordo com os termos de uso</label>
        <input type="checkbox" name="termo" id="termos">
        <br>

        <input type="submit" value="Enviar">
    </form>

</body>

</html>
